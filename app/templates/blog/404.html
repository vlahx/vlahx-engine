{% extends "base.html" %}

{% block content %}
  <section class="container py-5 text-center">
    <div class="mx-auto" style="max-width: 640px;">
      <span class="display-1 fw-bold text-primary d-block mb-4">404</span>
      <div class="card card-body bg-body-tertiary border-0 shadow-sm mb-4">
        <p class="text-secondary fs-5 mb-0">Nu există articolul cu slug: <code class="bg-body rounded px-2 py-1">{{ slug }}</code></p>
      </div>
      <a class="btn btn-primary btn-lg" href="/">{{ t_safe(translations, 'blog.notFound.backToBlog') }}</a>
    </div>
  </section>
{% endblock %}
