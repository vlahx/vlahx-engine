<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VlahX Core 2.0 — Account Registration & Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .install-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 580px;
      padding: 2.5rem;
    }
    .brand-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      margin: 0 auto 1.5rem auto;
    }
    .form-control {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 0.25rem rgba(139, 92, 246, 0.25);
      color: #ffffff;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(168, 85, 247, 0.5);
      color: white;
    }
  </style>
</head>
<body>
  <div class="install-card">
    <div class="brand-logo">⚡</div>
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1">VlahX Core 2.0</h2>
      <p class="text-secondary small">Initial Admin Account Registration</p>
    </div>

    {% if error %}
    <div class="alert alert-danger border-0 rounded-3 text-center mb-4">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <form action="/install" method="POST">
      <div class="mb-4">
        <h5 class="fw-semibold mb-3" style="color: #a855f7;"><i class="bi bi-person-badge me-2"></i>Create Your Master Admin Account</h5>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Choose a username" required />
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="your.email@example.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter secure password" required />
        </div>
      </div>

      <hr class="border-secondary opacity-25 my-4" />

      <div class="mb-4">
        <h5 class="fw-semibold mb-3" style="color: #a855f7;"><i class="bi bi-sliders me-2"></i>Initial Site Settings</h5>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Site Name</label>
          <input type="text" name="site_name" class="form-control" placeholder="e.g. My Modular Platform" value="VlahX Platform" required />
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary small fw-semibold">Tagline</label>
          <input type="text" name="site_tagline" class="form-control" placeholder="e.g. Modular High-Performance Engine" value="Modular High-Performance Engine" />
        </div>
      </div>

      <button type="submit" class="btn btn-gradient w-100 mt-2">
        <i class="bi bi-rocket-takeoff me-2"></i>Register Account & Launch Platform
      </button>
    </form>
  </div>
</body>
</html>
